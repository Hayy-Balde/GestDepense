services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: gestdepense-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html
      - ./backend/storage/app/public:/var/www/html/storage/app/public
    depends_on:
      - app
    networks:
      - gestdepense

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gestdepense-app
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gestdepense

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gestdepense-queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
    networks:
      - gestdepense

  # Task Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gestdepense-scheduler
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
    networks:
      - gestdepense

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: gestdepense-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gestdepense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hayy2000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestdepense"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gestdepense

  # Redis
  redis:
    image: redis:7-alpine
    container_name: gestdepense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gestdepense

  # Frontend (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gestdepense-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    networks:
      - gestdepense

volumes:
  postgres_data:
  redis_data:

networks:
  gestdepense:
    driver: bridge

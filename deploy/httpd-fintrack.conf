# =============================================================================
# fin-track — Accès local via Apache (deux sous-domaines distincts)
#   • http://fintrack.test     → Frontend (SPA React)   : /Users/admin/Sites/fin-track/frontend
#   • http://api.fintrack.test → Backend Laravel (API)  : /Users/admin/Sites/fin-track/backend/public
#
# PRÉREQUIS CRITIQUE (macOS) :
#   Le httpd DOIT être lancé avec OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES.
#   Sans cette variable, mod_php segfault (objc_initializeAfterForkError)
#   dès qu'une route touche PostgreSQL (login, session database, ...).
#   Ajoutée dans /Library/LaunchDaemons/homebrew.mxcl.httpd.plist :
#     <key>OBJC_DISABLE_INITIALIZE_FORK_SAFETY</key><string>YES</string>
#
# ACTIVATION (une seule fois) :
#   1) Résolution des noms dans /etc/hosts — INDIQUER LES DEUX familles (IPv4 ET IPv6).
#      Ajouter UNIQUEMENT l'entrée IPv4 rend la résolution lente (~5s) : la requête
#      AAAA part alors vers le DNS public (8.8.8.8) qui timeout hors ligne. Avec les
#      deux lignes par domaine, tout vient de /etc/hosts (instantané, offline) :
#        127.0.0.1  fintrack.test api.fintrack.test
#        ::1        fintrack.test api.fintrack.test
#   2) Inclure ce fichier dans /usr/local/etc/httpd/httpd.conf :
#        Include /Users/admin/Sites/fin-track/httpd-fintrack.conf
#      (ou copier les blocs <VirtualHost> ci-dessous dans httpd.conf)
#   3) Recharger : sudo /usr/local/opt/httpd/bin/apachectl graceful
#
# L'API n'est plus sur la même origine : le frontend appelle
# http://api.fintrack.test/api/v1 (CORS configuré côté Laravel via FRONTEND_URL).
# =============================================================================

# -----------------------------------------------------------------------------
# Frontend (SPA statique) — http://fintrack.test
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName fintrack.test

    DocumentRoot "/Users/admin/Sites/fin-track/frontend"

    <Directory "/Users/admin/Sites/fin-track/frontend">
        AllowOverride All
        Options Indexes FollowSymLinks MultiViews
        Require all granted
        DirectoryIndex index.html
        # SPA fallback : toute URL non-fichier sert index.html (deep-links /revenus, ...)
        FallbackResource /index.html
    </Directory>

    ErrorLog "/usr/local/var/log/httpd/fintrack-front-error.log"
    CustomLog "/usr/local/var/log/httpd/fintrack-front-access.log" common
</VirtualHost>

# -----------------------------------------------------------------------------
# Backend (API Laravel) — http://api.fintrack.test
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName api.fintrack.test

    DocumentRoot "/Users/admin/Sites/fin-track/backend/public"

    <Directory "/Users/admin/Sites/fin-track/backend/public">
        AllowOverride All
        Options Indexes FollowSymLinks MultiViews
        Require all granted
    </Directory>

    ErrorLog "/usr/local/var/log/httpd/fintrack-api-error.log"
    CustomLog "/usr/local/var/log/httpd/fintrack-api-access.log" common
</VirtualHost>
